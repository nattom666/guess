<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>当てます</title>
<meta name="description" content="2択の質問に答えるだけで、あなたの生まれ年や中学の部活を当てます。答え合わせが増えるほど賢くなります。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233446ff'/%3E%3Cg fill='%23fff'%3E%3Crect x='5' y='40' width='6' height='11' rx='3' opacity='.35'/%3E%3Crect x='13' y='33' width='6' height='18' rx='3' opacity='.5'/%3E%3Crect x='21' y='24' width='6' height='27' rx='3' opacity='.7'/%3E%3Crect x='37' y='24' width='6' height='27' rx='3' opacity='.7'/%3E%3Crect x='45' y='33' width='6' height='18' rx='3' opacity='.5'/%3E%3Crect x='53' y='40' width='6' height='11' rx='3' opacity='.35'/%3E%3C/g%3E%3Crect x='29' y='13' width='6' height='38' rx='3' fill='%23ff4f2e'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&family=Outfit:wght@500;700;800&display=swap">
<meta property="og:title" content="当てます">
<meta property="og:description" content="2択の質問に答えるだけで、あなたの生まれ年や中学の部活を当てます。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: 最大480pxの1カラムのアプリ。上にタブと確信度メーター、主役は質問カード、下に候補マップ */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --ink: #0b0d12;
  --muted: #5d6372;
  --line: #e2e4ea;
  --tile: #e9ebf0;
  --accent: #3446ff;
  --accent-rgb: 52, 70, 255;
  --accent-ink: #ffffff;
  --accent-soft: #e8eaff;
  --hot: #ff4f2e;
  --shadow: 0 1px 2px rgba(11, 13, 18, .05), 0 8px 24px rgba(11, 13, 18, .06);
  --f-display: "Outfit", "M PLUS 1", "Hiragino Sans", sans-serif;
  --f-body: "M PLUS 1", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --r-lg: 20px;
  --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0b0f; --surface: #14161c; --ink: #f1f3f8; --muted: #9aa0ae; --line: #252833; --tile: #1c1f28;
    --accent: #7d88ff; --accent-rgb: 125, 136, 255; --accent-ink: #0a0b0f; --accent-soft: #1d2140; --hot: #ff7a5c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0b0f; --surface: #14161c; --ink: #f1f3f8; --muted: #9aa0ae; --line: #252833; --tile: #1c1f28;
  --accent: #7d88ff; --accent-rgb: 125, 136, 255; --accent-ink: #0a0b0f; --accent-soft: #1d2140; --hot: #ff7a5c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.app > .bar, .app > .tabs { order: 0; } .app > .meter { order: 1; } .app > .view { order: 2; } .app > .map { order: 3; } .app > .foot { order: 4; }
.app[data-view="q"] > .map, .app[data-view="r"] > .map { order: 2; }
.app[data-view="q"] > .view, .app[data-view="r"] > .view { order: 3; }

/* ヘッダー */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { display: inline-flex; align-items: flex-end; gap: 3px; width: 26px; height: 22px; }
.mark i { display: block; width: 6px; border-radius: 2px; background: var(--accent); }
.mark i:nth-child(1) { height: 40%; opacity: .45; } .mark i:nth-child(2) { height: 100%; } .mark i:nth-child(3) { height: 65%; opacity: .7; }
.brand-name { font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.qcount { font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* タブ（質問中は隠す。途中で切り替えて進み具合を失わないように） */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--tile); margin-top: -4px; }
.tab {
  flex: 1; appearance: none; border: 0; background: none; cursor: pointer; border-radius: 999px;
  padding: 7px 8px; font-weight: 700; font-size: 14px; color: var(--muted);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.app[data-view="q"] > .tabs { display: none; }

/* 確信度メーター */
.meter { display: flex; align-items: center; gap: 10px; margin-top: -6px; }
.meter-track { flex: 1; height: 6px; border-radius: 999px; background: var(--tile); overflow: hidden; }
.meter-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.meter-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }

/* 共通パーツ */
.view { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card-title { margin: 0; font-size: 17px; font-weight: 800; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cta {
  appearance: none; border: 0; cursor: pointer; border-radius: var(--r-md);
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; padding: 15px 18px;
  transition: transform .08s ease, filter .15s ease;
}
.cta:hover { filter: brightness(1.06); }
.cta:active { transform: translateY(1px); }
.btn2 {
  appearance: none; cursor: pointer; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; font-size: 15px; padding: 13px 16px;
}
.btn2:hover { border-color: var(--muted); }
.share-main { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.share-main:hover { border-color: transparent; filter: brightness(1.06); }
.share-main svg { width: 18px; height: 18px; }

.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; background: var(--surface); color: var(--ink);
  border-radius: 22px 22px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: sheet-up .22s ease-out;
}
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-title { margin: 0 0 14px; text-align: center; font-weight: 700; font-size: 15px; }
.sheet-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.sheet-item {
  appearance: none; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; line-height: 1.3; text-decoration: none; text-align: center;
}
.sheet-icon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.sheet-icon svg { width: 26px; height: 26px; }
.sheet-item:hover .sheet-icon { filter: brightness(1.1); }
.sheet-close { width: 100%; }

/* タイトル */
h1 { margin: 0; font-weight: 800; font-size: clamp(34px, 9.5vw, 46px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
h1 .hl { color: var(--accent); }
.lede { margin: 0; color: var(--muted); font-size: 15px; }
.facts { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 10px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts b { font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.facts span { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* 質問 */
.qhead { display: flex; align-items: center; gap: 10px; }
.qno { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.chip:empty { display: none; }
.qtext { margin: 0; font-weight: 800; font-size: clamp(20px, 5.4vw, 23px); line-height: 1.55; text-wrap: pretty; min-height: 3.1em; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.opt {
  appearance: none; cursor: pointer; text-align: left; width: 100%;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md);
  padding: 14px 14px; font-weight: 700; font-size: 16px; line-height: 1.45;
  box-shadow: var(--shadow);
  transition: border-color .15s ease, transform .08s ease, background-color .15s ease;
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.99); background: var(--accent-soft); }
.opt .key {
  flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 800; font-size: 14px;
  background: var(--accent-soft); color: var(--accent);
}
.opt-text { min-width: 0; }
.opt-mid { box-shadow: none; border-style: dashed; font-weight: 500; font-size: 15px; padding-block: 11px; }
.opt-mid .key { background: var(--tile); color: var(--muted); }
.soft { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-soft {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: transparent;
  border-radius: var(--r-md); padding: 9px 10px; font-size: 14px; color: var(--muted);
}
.opt-soft b { font-family: var(--f-display); font-weight: 800; color: var(--accent); margin-left: 2px; }
.opt-soft:hover { color: var(--ink); border-color: var(--muted); }
.links { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px; }
.link { background: none; border: 0; padding: 6px 2px; font-size: 13px; color: var(--muted); cursor: pointer; }
.link:hover { color: var(--ink); }
.link.strong { color: var(--accent); font-weight: 700; margin-left: auto; }

/* 結果 */
.reveal { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.year { margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.year .num { font-family: var(--f-display); font-weight: 800; font-size: clamp(76px, 24vw, 104px); line-height: 1; letter-spacing: -.035em; color: var(--accent); font-variant-numeric: tabular-nums; }
.year .unit { font-weight: 800; font-size: 22px; }
.year .name { font-weight: 800; font-size: clamp(32px, 9.5vw, 50px); line-height: 1.15; color: var(--accent); }
.wareki { margin: 4px 0 0; font-weight: 700; font-size: 16px; }
.wareki:empty { display: none; }
.range { margin: 0; font-size: 14px; color: var(--muted); }
.pick { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.pick-part { display: flex; flex-direction: column; gap: 10px; }
.pick label { font-size: 14px; font-weight: 700; }
.select {
  width: 100%; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px;
}
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.stepper button { cursor: pointer; font-size: 22px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg); }
.stepper input {
  min-width: 0; width: 100%; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 28px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 0;
  font-variant-numeric: tabular-nums;
}
.verdict { margin: 0; font-weight: 800; font-size: 26px; line-height: 1.35; }
.verdict.hit { color: var(--accent); }
.share { display: flex; flex-direction: column; gap: 10px; }
.share p {
  margin: 0; background: var(--bg); border-radius: var(--r-md); padding: 12px 14px;
  font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all;
}
.hist-box { gap: 0; }
.hist-box summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.hist { margin: 12px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.hist li span { color: var(--accent); font-weight: 700; }
.hist li span.skip { color: var(--muted); font-weight: 400; }

/* 候補マップ（生まれ年は年代ごとの表、ほかは名前のマス） */
.map { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.map-head { display: flex; justify-content: space-between; align-items: baseline; }
.map-title { font-size: 13px; font-weight: 800; }
.map-hint { font-size: 11.5px; color: var(--muted); }
.grid { display: grid; gap: 3px; }
.grid-years { grid-template-columns: 2.5em repeat(10, minmax(0, 1fr)); }
.grid-chips { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.grid > * { min-width: 0; }
.row-label { font-family: var(--f-display); font-size: 11px; font-weight: 700; color: var(--muted); display: flex; align-items: center; font-variant-numeric: tabular-nums; }
.cell {
  --a: 0;
  aspect-ratio: 1; max-width: 100%; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 11px; font-variant-numeric: tabular-nums;
  background: rgba(var(--accent-rgb), calc(.06 + var(--a) * .94));
  color: var(--muted);
  transition: background-color .45s ease, color .45s ease, box-shadow .45s ease, transform .3s ease;
}
.cell.lit { color: var(--accent-ink); }
.cell.void { background: none; }
.app[data-view="q"] .grid { gap: 2px; }
.app[data-view="q"] .cell { aspect-ratio: 1.65; border-radius: 5px; font-size: 10px; }
.app[data-view="q"] .map { padding: 12px 14px; gap: 8px; }
.grid-chips .cell, .app[data-view="q"] .grid-chips .cell {
  aspect-ratio: auto; padding: 8px 2px; border-radius: 8px;
  font-family: var(--f-body); font-size: 11.5px; line-height: 1.3; text-align: center;
}
.app[data-view="q"] .grid-chips { gap: 3px; }
.app[data-view="q"] .grid-chips .cell { padding: 5px 2px; font-size: 10.5px; }
.cell.top { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); transform: scale(1.08); color: var(--accent-ink); z-index: 1; }
.cell.range { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cell.truth { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--hot); }

/* フッター */
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: #18b26b; }

.fade { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade { animation: none; }
  .cell, .opt, .meter-fill { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app" data-view="title">
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">当てます</span>
    </div>
    <div class="bar-right">
      <span class="qcount" id="qcount"></span>
      <button class="ghost" id="quit" type="button" hidden>やめる</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="当てるもの"></nav>

  <div class="meter" id="meter" hidden>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    <span class="meter-label" id="meterLabel"></span>
  </div>

  <!-- タイトル -->
  <section class="view" id="vTitle">
    <p class="eyebrow" id="tEyebrow"></p>
    <h1 id="tHead"></h1>
    <p class="lede" id="tLede"></p>
    <button class="cta" id="start" type="button">はじめる</button>
    <ul class="facts">
      <li><b id="qtotal"></b><span>問からランダムに出題</span></li>
      <li><b id="factCats"></b><span id="factCatsLabel"></span></li>
      <li><b id="factGames">0</b><span>回の答え合わせで学習</span></li>
    </ul>
  </section>

  <!-- 質問 -->
  <section class="view" id="vQ" hidden>
    <div class="qhead">
      <span class="qno" id="qno"></span>
      <span class="chip" id="qcat"></span>
    </div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="answers">
      <button class="opt" id="ansA" type="button"><span class="key">A</span><span class="opt-text" id="ansAText"></span></button>
      <button class="opt" id="ansB" type="button"><span class="key">B</span><span class="opt-text" id="ansBText"></span></button>
      <div class="soft" id="softRow">
        <button class="opt-soft" id="ansPA" type="button">たぶん <b>A</b></button>
        <button class="opt-soft" id="ansPB" type="button">たぶん <b>B</b></button>
      </div>
      <button class="opt opt-mid" id="ansM" type="button"><span class="key">C</span><span class="opt-text">わからない</span></button>
    </div>
    <div class="links">
      <button class="link" id="back" type="button" hidden>← ひとつ前</button>
      <button class="link strong" id="guessNow" type="button">もう当てて！</button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="view" id="vR" hidden>
    <div class="reveal" id="reveal">
      <p class="eyebrow" id="rEyebrow"></p>
      <p class="year"><span class="num" id="rMain"></span><span class="unit" id="rUnit"></span></p>
      <p class="wareki" id="rSub"></p>
      <p class="range" id="rNote"></p>
    </div>

    <div class="card" id="check">
      <h2 class="card-title">答え合わせ</h2>
      <div class="row">
        <button class="cta" id="hit" type="button">当たり！</button>
        <button class="btn2" id="miss" type="button">ちがう…</button>
      </div>
      <div class="pick" id="pick" hidden>
        <div class="pick-part" id="pickYear">
          <label for="yearInput">本当の生まれ年（西暦）</label>
          <div class="stepper">
            <button id="yMinus" type="button" aria-label="1年前">−</button>
            <input id="yearInput" type="number" inputmode="numeric" min="1930" max="2020">
            <button id="yPlus" type="button" aria-label="1年後">＋</button>
          </div>
          <p class="note" id="yWareki"></p>
          <button class="cta" id="sendYear" type="button">この年で答え合わせ</button>
        </div>
        <div class="pick-part" id="pickCat">
          <label for="catInput" id="catLabel"></label>
          <select class="select" id="catInput"></select>
          <button class="cta" id="sendCat" type="button">これで答え合わせ</button>
        </div>
      </div>

<script>
// ===== 当てます: 判定エンジン（どのタブも共通。makeEngine にゲームの定義 def を渡す） =====
// def.cats      候補 [{ key, label, short }]
// def.questions 質問 [{ id, cat, q, a, b, ... }]
// def.priorP    (質問, 候補, 候補の番号) → その候補の人が A と答える確率（学習前の値）
// def.ordered   候補に順番がある（生まれ年）なら true。学習データを前後2つの候補にもにじませる

function interp(pts, y) {
  if (y <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (y <= pts[i][0]) {
      const [x0, p0] = pts[i - 1], [x1, p1] = pts[i];
      return p0 + (p1 - p0) * (y - x0) / (x1 - x0);
    }
  }
  return pts[pts.length - 1][1];
}

const K_PRIOR = 6;              // 学習前の値は、疑似回答6件分の重み
const PMIN = 0.03, PMAX = 0.97;
// 答え: "a" | "b" は言い切り。"pa" | "pb"（たぶん）は尤度の平方根＝半分の強さ。それ以外（わからない）は使わない
const SOFT_POWER = 0.5;
const ANSWERS = ["a", "b", "pa", "pb"];
const ANSWER_COUNT = { a: [1, 0], b: [0, 1], pa: [0.5, 0], pb: [0, 0.5] };   // 学習データの [A, B] への加算

// 出題のばらつき
const RECENT_WEIGHT = 0.85;   // 直近のゲームで出た質問の情報量を最大85%引き
const SAME_CAT_WEIGHT = 0.6;  // 直前と同じ分野は情報量を4割引き
const POOL_RATIO = 0.7;       // 最良の7割以上の情報量がある質問を候補にする
const POOL_MAX = 8, FIRST_POOL = 20;
const MIN_Q = 6;

function entropy(pi) { let h = 0; for (const v of pi) if (v > 1e-12) h -= v * Math.log2(v); return h; }
function normalize(pi) { const s = pi.reduce((x, v) => x + v, 0); return pi.map(v => v / s); }
function argmax(pi) { let b = 0; for (let i = 1; i < pi.length; i++) if (pi[i] > pi[b]) b = i; return b; }

// 直近のゲームの出題履歴（新しい順の配列の配列）→ { 質問id: 0〜1 }
function recentWeights(history) {
  const w = {};
  (history || []).forEach((ids, k) => {
    const v = 1 - k / 6;   // 1つ前のゲーム=1、6つ前=ほぼ0
    if (v <= 0 || !Array.isArray(ids)) return;
    for (const id of ids) w[id] = Math.max(w[id] || 0, v);
  });
  return w;
}

function makeEngine(def) {
  const cats = def.cats, N = cats.length, Q = def.questions;
  const KERNEL = def.ordered ? [0.25, 0.5, 1, 0.5, 0.25] : [1];
  const R = (KERNEL.length - 1) / 2;
  const PRIOR = Q.map(q => cats.map((c, ci) => def.priorP(q, c, ci)));

  // counts = { 質問id: { 候補key: [A, B] } }。候補の事前分布は一様（遊んだ人の分布は使わない）
  function buildModel(counts) {
    counts = counts || {};
    const P = Q.map((q, qi) => {
      const c = counts[q.id] || {};
      return cats.map((_, ci) => {
        let a = 0, b = 0;
        for (let d = -R; d <= R; d++) {
          const k = cats[ci + d], v = k && c[k.key]; if (!v) continue;
          const w = KERNEL[d + R]; a += w * (v[0] || 0); b += w * (v[1] || 0);
        }
        const p = (K_PRIOR * PRIOR[qi][ci] + a) / (K_PRIOR + a + b);
        return Math.min(PMAX, Math.max(PMIN, p));
      });
    });
    return { P, prior: cats.map(() => 1 / N) };
  }

  function likelihood(model, qi, ci, ans) {
    const p = model.P[qi][ci];
    if (ans === "a") return p;
    if (ans === "b") return 1 - p;
    if (ans === "pa") return Math.pow(p, SOFT_POWER);
    if (ans === "pb") return Math.pow(1 - p, SOFT_POWER);
    return 1;
  }

  function update(pi, model, qi, ans) {
    if (!ANSWERS.includes(ans)) return pi;
    return normalize(pi.map((v, i) => v * likelihood(model, qi, i, ans)));
  }

  function infoGain(pi, model, qi) {
    const h0 = entropy(pi);
    let exp = 0;
    for (const o of ["a", "b"]) {
      let po = 0; for (let i = 0; i < N; i++) po += pi[i] * likelihood(model, qi, i, o);
      if (po > 1e-9) exp += po * entropy(update(pi, model, qi, o));
    }
    return h0 - exp;
  }

  // 情報量が上位に近い候補の中から、情報量に比例した確率で抽選する
  function pickQuestion(pi, model, asked, rand, recent, lastCats) {
    rand = rand || Math.random; recent = recent || {}; lastCats = lastCats || [];
    const scored = [];
    Q.forEach((q, qi) => {
      if (asked.has(qi)) return;
      const g = infoGain(pi, model, qi);
      let w = 1 - RECENT_WEIGHT * (recent[q.id] || 0);
      if (q.cat && lastCats.includes(q.cat)) w *= SAME_CAT_WEIGHT;
      scored.push([g * w, qi, g]);
    });
    if (!scored.length) return null;
    scored.sort((x, y) => y[0] - x[0]);
    const best = scored[0][0];
    const pool = asked.size === 0 ? scored.slice(0, FIRST_POOL)
      : scored.filter(s => s[0] >= best * POOL_RATIO).slice(0, POOL_MAX);
    const total = pool.reduce((t, s) => t + s[0], 0);
    let r = rand() * total;
    for (const s of pool) { r -= s[0]; if (r <= 0) return { qi: s[1], gain: s[2] }; }
    const s = pool[pool.length - 1];
    return { qi: s[1], gain: s[2] };
  }

  function band(pi) {
    const i = argmax(pi);
    return def.ordered ? pi[i] + (pi[i - 1] || 0) + (pi[i + 1] || 0) : pi[i];
  }

  // 確信度 0〜1。何も絞れていない（一様な）状態を0、1つに確定した状態を1にする
  // 順番がある候補は前後1つまで含めて数える
  function confidence(pi) {
    const base = (def.ordered ? 3 : 1) / N;
    return Math.max(0, (band(pi) - base) / (1 - base));
  }

  function shouldGuess(pi, model, asked) {
    const n = asked.size;
    if (n >= def.maxQ) return true;
    if (n < MIN_Q) return false;
    const top = pi[argmax(pi)];
    if (top >= def.guessTop) return true;
    if (def.ordered && band(pi) >= 0.9 && n >= 10) return true;
    const next = pickQuestion(pi, model, asked, () => 0);
    return !next || next.gain < 0.03;
  }

  // 順番がある候補だけ: 最有力から左右に広げて、確率の合計が mass に届く範囲（候補の番号）
  function credibleRange(pi, mass) {
    let lo = argmax(pi), hi = lo, s = pi[lo];
    while (s < mass && (lo > 0 || hi < N - 1)) {
      const l = lo > 0 ? pi[lo - 1] : -1, r = hi < N - 1 ? pi[hi + 1] : -1;
      if (l >= r) { lo--; s += l; } else { hi++; s += r; }
    }
    return [lo, hi];
  }

  return { N, buildModel, update, pickQuestion, shouldGuess, confidence, credibleRange };
}

function wareki(y) {
  if (y === 1989) return "昭和64年／平成元年";
  if (y === 2019) return "平成31年／令和元年";
  if (y < 1989) return "昭和" + (y - 1925) + "年";
  if (y < 2019) { const n = y - 1988; return "平成" + (n === 1 ? "元" : n) + "年"; }
  const n = y - 2018; return "令和" + (n === 1 ? "元" : n) + "年";
}

<script>
// ===== 当てます: 学習データの保存先（Supabase） =====
// 接続先は config.js の UMARE_CONFIG = { supabaseUrl, supabaseAnonKey }。anon キーで「追加」と「集計の読み出し」だけができる。
//   生まれ年（def.store === "year"）… plays / answer_stats / play_stats（supabase/schema.sql）
//   それ以外（def.store === "game"）  … game_plays / game_answer_stats / game_play_stats（supabase/schema-games.sql）
//
//   UmareStore.connect(def, { onStats, onStatus }) -> Promise<boolean>
//     保存先が使えれば true。集計が届くたびに onStats({ counts: {質問id: {候補key: [A, B]}}, games }) を呼ぶ。
//     onStatus("timeout" | "error") で不調を知らせる。
//   UmareStore.addPlay(def, { truth, guess, answers }) -> Promise<void>
//     失敗時は { code } を持つエラーを投げる（"not_allowed" | "unavailable" | その他）。
const UmareStore = (() => {
  const cfg = (typeof UMARE_CONFIG === "object" && UMARE_CONFIG) || {};
  const base = (cfg.supabaseUrl || "").replace(/\/+$/, "");
  const key = cfg.supabaseAnonKey || "";
  const ready = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(base) && key.length > 20;
  const headers = () => ({ apikey: key, Authorization: "Bearer " + key });

  async function getAll(path, timeoutMs) {
    const rows = [], page = 1000;
    for (let from = 0; from < 100000; from += page) {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeoutMs);
      let res;
      try {
        res = await fetch(base + "/rest/v1/" + path, {
          headers: { ...headers(), Range: from + "-" + (from + page - 1), "Range-Unit": "items" },
          signal: ctl.signal,
        });
      } finally { clearTimeout(t); }
      if (!res.ok && res.status !== 206) throw { code: res.status === 416 ? "end" : "http_" + res.status };
      const chunk = await res.json();
      rows.push(...chunk);
      if (chunk.length < page) break;
    }
    return rows;
  }

  async function load(def) {
    const s = { counts: {}, games: 0 };
    const put = (qid, truth, a, b) => {
      if (typeof qid !== "string") return;
      (s.counts[qid] || (s.counts[qid] = {}))[truth] = [+a || 0, +b || 0];
    };
    if (def.store === "year") {
      const [ans, plays] = await Promise.all([
        getAll("answer_stats?select=qid,year,a,b", 10000),
        getAll("play_stats?select=n", 10000),
      ]);
      for (const r of ans) put(r.qid, String(r.year), r.a, r.b);
      for (const r of plays) s.games += +r.n || 0;
    } else {
      const g = encodeURIComponent(def.id);
      const [ans, plays] = await Promise.all([
        getAll("game_answer_stats?select=qid,truth,a,b&game=eq." + g, 10000),
        getAll("game_play_stats?select=n&game=eq." + g, 10000),
      ]);
      for (const r of ans) put(r.qid, r.truth, r.a, r.b);
      for (const r of plays) s.games += +r.n || 0;
    }
    return s;
  }

  const notify = {};
  return {
    async connect(def, { onStats, onStatus }) {
      if (!ready) return false;
      notify[def.id] = onStats;
      const slow = setTimeout(() => onStatus("timeout"), 10000);
      load(def).then(s => { clearTimeout(slow); onStats(s); },
                     () => { clearTimeout(slow); onStatus("error"); });
      return true;
    },
    async addPlay(def, { truth, guess, answers }) {
      if (!ready) throw { code: "unavailable" };
      const [table, row] = def.store === "year"
        ? ["plays", { v: 1, truth_year: +truth, guess_year: +guess, answers }]
        : ["game_plays", { game: def.id, truth, guess, answers }];
      const res = await fetch(base + "/rest/v1/" + table, {
        method: "POST",
        headers: { ...headers(), "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(row),
      }).catch(() => { throw { code: "unavailable" }; });
      if (res.status === 401 || res.status === 403) throw { code: "not_allowed" };
      if (res.status >= 500) throw { code: "unavailable" };
      if (!res.ok) throw { code: "http_" + res.status };
      // 保存できたら最新の集計を取り直す（次のゲームから反映）
      if (notify[def.id]) load(def).then(notify[def.id], () => {});
    },
  };
})();
</script>
<script>
// ===== 当てます: 画面とゲーム進行（タブごとにゲームの定義 def を切り替える） =====
// 依存: seed.js（SEED）, games/*.js（GAME_*）, engine.js, config.js, storage-supabase.js（UmareStore）
(() => {
  const $ = id => document.getElementById(id);
  const BASE_URL = "https://nattom666.github.io/guess-my-year/";
  const GAMES = [GAME_YEAR, GAME_CLUB];
  const num = v => (typeof v === "number" && isFinite(v) && v >= 0 ? Math.min(v, 1e6) : 0);
  const shareUrl = def => (def.id === GAMES[0].id ? BASE_URL : BASE_URL + "#" + def.id);

  // ---------- タブごとの状態 ----------
  // 判定に使うのは答えの集計（counts）だけ。的中率は画面に出さず、Supabase にだけ残す
  function loadHist(key) {
    try { const v = JSON.parse(localStorage.getItem(key) || "[]"); if (Array.isArray(v)) return v.slice(0, 6); } catch (e) {}
    return [];
  }
  const T = {};
  for (const def of GAMES) {
    T[def.id] = { def, E: makeEngine(def), games: 0, connected: false, storeReady: false, loaded: false,
                  canWrite: true, writing: false, status: ["学習データを読みこみ中…", false], hist: loadHist(def.histKey) };
    applyStats(T[def.id], null);
  }
  let tab = null, game = null;

  function mergeStats(list) {
    const counts = {}; let games = 0;
    for (const s of list) {
      if (!s || typeof s !== "object") continue;
      games += num(s.games);
      for (const [qid, byKey] of Object.entries(s.counts || {})) {
        if (!byKey || typeof byKey !== "object") continue;
        const dst = counts[qid] || (counts[qid] = {});
        for (const [k, v] of Object.entries(byKey)) {
          if (!Array.isArray(v)) continue;
          const cur = dst[k] || (dst[k] = [0, 0]);
          for (let i = 0; i < 2; i++) cur[i] += num(v[i]);
        }
      }
    }
    return { counts, games };
  }
  function applyStats(t, live) {
    const m = mergeStats([t.def.seed, live]);
    t.model = t.E.buildModel(m.counts);
    t.games = m.games;
  }

  function setStatus(t, text, on) { t.status = [text, on]; if (t === tab) renderStats(); }
  function renderStats() {
    $("factGames").textContent = tab.games;
    const [text, on] = tab.status;
    $("status").innerHTML = "";
    const dot = document.createElement("span"); dot.className = "dot" + (on ? " on" : "");
    $("status").append(dot, document.createTextNode(text));
  }

  async function connect(t) {
    if (t.connected) return;
    t.connected = true;
    t.storeReady = await UmareStore.connect(t.def, {
      onStats: live => {
        t.loaded = true; applyStats(t, live);
        setStatus(t, t.games > 0 ? "みんなの答え合わせ " + t.games + "回で学習中" : "まだ答え合わせはありません。最初の1回をどうぞ", true);
      },
      onStatus: kind => {
        if (kind === "timeout" && !t.loaded) setStatus(t, "学習データにまだつながりません（基本データで判定します）", false);
        if (kind === "error") setStatus(t, "学習データを読めませんでした（基本データで判定します）", false);
      },
    });
    if (!t.storeReady) setStatus(t, "学習データの保存先が未設定です（基本データで判定します）", false);
  }

  function pushHist(t, ids) {
    t.hist = [ids, ...t.hist].slice(0, 6);
    try { localStorage.setItem(t.def.histKey, JSON.stringify(t.hist)); } catch (e) {}
  }

  async function record(g, truthIdx) {
    const t = g.t;
    if (truthIdx < 0) return t.def.outOfRange || "対応範囲の外なので、学習には使いません。";
    if (!t.storeReady) return "学習データの保存先につながっていないため、今回の結果は保存されません。";
    if (!t.canWrite) return "この閲覧権限では、結果を学習データに送れません（遊ぶことはできます）。";
    if (t.writing) return "";
    t.writing = true;
    const answers = {};
    for (const { qi, ans } of g.log) {
      const add = ANSWER_COUNT[ans];
      if (!add) continue;
      const qid = t.def.questions[qi].id, cur = answers[qid] || [0, 0];
      answers[qid] = cur.map((v, k) => v + add[k]);
    }
    const play = { truth: t.def.cats[truthIdx].key, guess: t.def.cats[g.guessIdx].key, answers };
    try {
      try { await UmareStore.addPlay(t.def, play); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await UmareStore.addPlay(t.def, play); }
        else throw e;
      }
      return "この答え合わせは、次の人の判定に使われます。";
    } catch (e) {
      if (e && e.code === "not_allowed") { t.canWrite = false; return "この閲覧権限では、結果を学習データに送れません（遊ぶことはできます）。"; }
      return "通信がうまくいかず、今回の結果は保存できませんでした。";
    } finally { t.writing = false; }
  }

  // ---------- 候補マップ ----------
  let cells = [];   // 候補の番号 → マス
  function buildMap() {
    const def = tab.def, g = $("grid");
    g.innerHTML = ""; g.className = "grid grid-" + def.layout; cells = [];
    if (def.layout === "years") {
      const byKey = {}, first = +def.cats[0].key, last = +def.cats[def.cats.length - 1].key;
      for (let d = Math.floor(first / 10) * 10; d <= last; d += 10) {
        const lab = document.createElement("div");
        lab.className = "row-label"; lab.textContent = d;
        g.appendChild(lab);
        for (let k = 0; k < 10; k++) {
          const y = d + k, c = document.createElement("div");
          if (y < first || y > last) c.className = "cell void";
          else { c.className = "cell"; c.textContent = String(y).slice(2); c.title = y + "年"; byKey[y] = c; }
          g.appendChild(c);
        }
      }
      cells = def.cats.map(c => byKey[c.key]);
    } else {
      for (const c of def.cats) {
        const el = document.createElement("div");
        el.className = "cell"; el.textContent = c.short; el.title = c.label;
        g.appendChild(el); cells.push(el);
      }
    }
    $("mapTitle").textContent = def.mapTitle;
    $("map").setAttribute("aria-label", def.mapTitle + "（濃いほど有力）");
  }

  // opts: { top, range: [lo, hi], truth }（どれも候補の番号）
  function paint(pi, opts) {
    opts = opts || {};
    const mx = Math.max(...pi);
    if (mx - Math.min(...pi) < 1e-9 * mx) return paintIdle();   // まだ何も絞れていない
    pi.forEach((v, i) => {
      const c = cells[i], a = Math.pow(v / mx, 0.8);
      c.style.setProperty("--a", a.toFixed(3));
      c.classList.toggle("lit", a > 0.55);
      c.classList.toggle("top", opts.top === i);
      c.classList.toggle("range", !!opts.range && i >= opts.range[0] && i <= opts.range[1] && i !== opts.top);
      c.classList.toggle("truth", opts.truth === i);
    });
  }
  // どの候補も同じ濃さで並べる
  function paintIdle() {
    for (const c of cells) { c.style.setProperty("--a", "0.18"); c.classList.remove("lit", "top", "range", "truth"); }
  }

  function setMeter(pi) {
    if (!pi) { $("meter").hidden = true; return; }
    const pct = Math.round(100 * tab.E.confidence(pi));
    $("meter").hidden = false;
    $("meterFill").style.width = pct + "%";
    $("meterLabel").textContent = "確信度 " + pct + "%";
  }

  // ---------- タブ ----------
  for (const def of GAMES) {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.id = "tab-" + def.id; b.textContent = def.tab;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => selectTab(def.id));
    $("tabs").appendChild(b);
  }

  function selectTab(id) {
    const t = T[id] || T[GAMES[0].id];
    if (tab === t) return;
    tab = t; game = null;
    const def = t.def;
    for (const d of GAMES) $("tab-" + d.id).setAttribute("aria-selected", String(d === def));
    $("tEyebrow").textContent = def.eyebrow;
    $("tHead").innerHTML = def.headline;   // 定義に書いた固定の文（利用者の入力は入らない）
    $("tLede").textContent = def.lede;
    $("qtotal").textContent = def.questions.length;
    $("factCats").textContent = def.factCats[0];
    $("factCatsLabel").textContent = def.factCats[1];
    document.title = def.name + "｜当てます";
    const sel = $("catInput"); sel.innerHTML = "";
    if (def.kind === "cat") {
      $("catLabel").textContent = def.pickLabel;
      def.cats.forEach((c, i) => sel.add(new Option(c.label, String(i))));
    }
    $("pickYear").hidden = def.kind !== "year";
    $("pickCat").hidden = def.kind !== "cat";
    buildMap(); paintIdle(); setMeter(null);
    $("qcount").textContent = "";
    show("title");
    const hash = def.id === GAMES[0].id ? "" : "#" + def.id;
    if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);
    renderStats();
    connect(t);
  }
  window.addEventListener("hashchange", () => selectTab(location.hash.slice(1)));

  // ---------- ゲーム ----------
  const views = { title: $("vTitle"), q: $("vQ"), r: $("vR") };
  function show(name) {
    for (const [k, el] of Object.entries(views)) el.hidden = k !== name;
    $("app").dataset.view = name;
    $("quit").hidden = name === "title";
  }

  function newGame() {
    game = { t: tab, E: tab.E, model: tab.model, recent: recentWeights(tab.hist), pi: tab.model.prior.slice(),
             asked: new Set(), log: [], stack: [], cur: null, guessIdx: null, done: false, histSaved: false };
    paint(game.pi); setMeter(game.pi);
    step();
    window.scrollTo({ top: 0 });
  }

  const Qs = () => game.t.def.questions;
  function lastCats() { return game.log.slice(-2).map(l => Qs()[l.qi].cat).filter(Boolean); }

  function step() {
    if (game.E.shouldGuess(game.pi, game.model, game.asked)) return finish();
    const pk = game.E.pickQuestion(game.pi, game.model, game.asked, Math.random, game.recent, lastCats());
    if (!pk) return finish();
    showQuestion(pk.qi, true);
    show("q");
  }

  function showQuestion(qi, animate) {
    game.cur = qi;
    const q = Qs()[qi], n = game.asked.size + 1;
    $("qno").textContent = "Q" + n;
    $("qcat").textContent = q.cat || "";
    $("qcount").textContent = n + "問目";
    $("qtext").textContent = q.q;
    $("ansAText").textContent = q.a;
    $("ansBText").textContent = q.b;
    $("back").hidden = game.stack.length === 0;
    if (animate) for (const id of ["qtext", "ansA", "ansB", "softRow", "ansM"]) { const el = $(id); el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); }
  }

  function answer(ans) {
    if (!game || game.cur == null) return;
    game.stack.push({ pi: game.pi, qi: game.cur });
    game.asked.add(game.cur);
    game.log.push({ qi: game.cur, ans });
    game.pi = game.E.update(game.pi, game.model, game.cur, ans);
    game.cur = null;
    paint(game.pi); setMeter(game.pi);
    step();
  }

  function undo() {
    if (!game || !game.stack.length) return;
    const last = game.stack.pop();
    game.asked.delete(last.qi);
    game.log.pop();
    game.pi = last.pi;
    paint(game.pi); setMeter(game.pi);
    showQuestion(last.qi, false);
  }

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el, from, to) {
    if (reduceMotion || from === to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 700;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function finish() {
    const def = game.t.def, i = argmax(game.pi), n = game.log.length;
    game.guessIdx = i;
    if (!game.histSaved) { game.histSaved = true; pushHist(game.t, game.log.map(l => Qs()[l.qi].id)); }
    $("qcount").textContent = n + "問で判定";
    $("rEyebrow").textContent = def.revealEyebrow;
    const main = $("rMain");
    if (def.kind === "year") {
      const r = game.E.credibleRange(game.pi, 0.8), y = +def.cats[i].key;
      const lo = +def.cats[r[0]].key, hi = +def.cats[r[1]].key;
      game.range = r;
      main.className = "num"; countUp(main, lo === y ? hi : lo, y);
      $("rUnit").textContent = "年生まれ";
      $("rSub").textContent = wareki(y);
      $("rNote").textContent = lo === hi ? "かなり自信あり" : "だいたい " + lo + "〜" + hi + "年のどこか";
      $("yearInput").value = y; syncWareki();
    } else {
      game.range = null;
      const second = game.pi.map((v, k) => [v, k]).sort((a, b) => b[0] - a[0])[1][1];
      main.className = "name"; main.textContent = def.cats[i].big || def.cats[i].label;
      $("rUnit").textContent = "";
      $("rSub").textContent = "";
      $("rNote").textContent = "次に近いのは " + def.cats[second].label;
      $("catInput").value = String(i);
    }
    $("check").hidden = false; $("pick").hidden = true; $("after").hidden = true;
    setShare(def.name + "：" + n + "問で予想されました！");
    renderHist();
    paint(game.pi, { top: i, range: game.range }); setMeter(game.pi);
    const rv = $("reveal"); rv.classList.remove("fade"); void rv.offsetWidth; rv.classList.add("fade");
    show("r");
    window.scrollTo({ top: 0 });
  }

  // 共有・コピーする文。結果画面に出た時点と、答え合わせの後で差し替える
  // 年齢などが分かってしまうので、予想した答え・本当の答えは文に入れない
  function setShare(msg) {
    const def = game.t.def, url = shareUrl(def);
    game.shareMsg = msg;
    const enc = encodeURIComponent, full = msg + "\n" + url;
    $("shareText").textContent = full;
    $("copy").textContent = "結果をコピー";
    $("shX").href = "https://twitter.com/intent/tweet?text=" + enc(msg) + "&url=" + enc(url);
    $("shLine").href = "https://line.me/R/share?text=" + enc(full);
    $("shFb").href = "https://www.facebook.com/sharer/sharer.php?u=" + enc(url);
    $("shMail").href = "mailto:?subject=" + enc(def.name) + "&body=" + enc(full);
  }

  function renderHist() {
    const ol = $("hist"); ol.innerHTML = "";
    for (const { qi, ans } of game.log) {
      const q = Qs()[qi], li = document.createElement("li");
      const s = document.createElement("span");
      const label = { a: q.a, b: q.b, pa: "たぶん " + q.a, pb: "たぶん " + q.b }[ans];
      if (label) s.textContent = label;
      else { s.textContent = "わからない"; s.className = "skip"; }
      li.append(document.createTextNode(q.q + " → "), s);
      ol.appendChild(li);
    }
  }

  function clampYear(v) {
    v = Math.round(Number(v));
    if (!isFinite(v)) v = game ? +game.t.def.cats[game.guessIdx].key : 1990;
    return Math.max(1930, Math.min(2020, v));
  }
  function syncWareki() {
    const v = clampYear($("yearInput").value);
    $("yWareki").textContent = v >= 1926 ? wareki(v) + "生まれ" : "";
  }

  // truth は候補の番号。生まれ年だけは範囲外の年もありうるので年そのものを受け取る
  async function settle(truth) {
    if (!game || game.done) return;
    game.done = true;
    const def = game.t.def, n = game.log.length, vt = $("vText");
    let truthIdx, msg;
    if (def.kind === "year") {
      const guessY = +def.cats[game.guessIdx].key, d = Math.abs(truth - guessY);
      truthIdx = def.cats.findIndex(c => +c.key === truth);
      vt.classList.toggle("hit", d === 0);
      vt.textContent = d === 0 ? "ピタリ！" : d === 1 ? "おしい！ 1年ずれ" : d + "年ずれ。くやしい…";
      msg = n + "問で" + (d === 0 ? "ズバリ当てられた！" : "予想され、" + d + "年ずれでした。");
    } else {
      truthIdx = truth;
      const hit = truthIdx === game.guessIdx;
      vt.classList.toggle("hit", hit);
      vt.textContent = hit ? "ピタリ！" : "はずれ… 正解は" + def.cats[truthIdx].label;
      msg = n + "問で" + (hit ? "ズバリ当てられた！" : "予想されたけど、はずれでした。");
    }
    $("check").hidden = true; $("after").hidden = false;
    setShare(def.name + "：" + msg);
    paint(game.pi, { top: game.guessIdx, range: game.range, truth: truthIdx >= 0 ? truthIdx : undefined });
    $("vLearn").textContent = "保存中…";
    $("vLearn").textContent = await record(game, truthIdx);
  }

  // ---------- イベント ----------
  $("start").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  $("ansA").addEventListener("click", () => answer("a"));
  $("ansB").addEventListener("click", () => answer("b"));
  $("ansM").addEventListener("click", () => answer("skip"));
  $("ansPA").addEventListener("click", () => answer("pa"));
  $("ansPB").addEventListener("click", () => answer("pb"));
  $("guessNow").addEventListener("click", () => { if (game) finish(); });
  $("back").addEventListener("click", undo);
  $("quit").addEventListener("click", () => {
    game = null; $("qcount").textContent = "";
    paintIdle(); setMeter(null); show("title");
  });
  $("hit").addEventListener("click", () => settle(game.t.def.kind === "year" ? +game.t.def.cats[game.guessIdx].key : game.guessIdx));
  $("miss").addEventListener("click", () => { $("pick").hidden = false; (game.t.def.kind === "year" ? $("yearInput") : $("catInput")).focus(); });
  $("yMinus").addEventListener("click", () => { $("yearInput").value = clampYear($("yearInput").value) - 1; syncWareki(); });
  $("yPlus").addEventListener("click", () => { $("yearInput").value = clampYear($("yearInput").value) + 1; syncWareki(); });
  $("yearInput").addEventListener("input", syncWareki);
  $("sendYear").addEventListener("click", () => {
    const v = clampYear($("yearInput").value); $("yearInput").value = v; settle(v);
  });
  $("sendCat").addEventListener("click", () => settle(+$("catInput").value));

  // 端末の共有シート（iPhone・Android・Mac など）を優先し、無いブラウザだけ自前のシートを出す
  const openSheet = () => { $("shCopyLabel").textContent = "コピー"; $("sheet").hidden = false; $("sheetClose").focus(); };
  const closeSheet = () => { $("sheet").hidden = true; $("share").focus(); };
  $("share").addEventListener("click", () => {
    if (!navigator.share) return openSheet();
    navigator.share({ title: game.t.def.name, text: game.shareMsg, url: shareUrl(game.t.def) })
      .catch(e => { if (!e || e.name !== "AbortError") openSheet(); });
  });
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  for (const id of ["shX", "shLine", "shFb", "shMail"]) $(id).addEventListener("click", closeSheet);
  $("shCopy").addEventListener("click", () => {
    const url = shareUrl(game.t.def);
    const ok = () => { $("shCopyLabel").textContent = "コピー済み"; setTimeout(closeSheet, 900); };
    try { navigator.clipboard.writeText(url).then(ok, () => prompt("リンクをコピーしてください", url)); }
    catch (e) { prompt("リンクをコピーしてください", url); }
  });
  $("copy").addEventListener("click", () => {
    const text = $("shareText").textContent;
    const done = () => { $("copy").textContent = "コピーしました"; setTimeout(() => { $("copy").textContent = "結果をコピー"; }, 1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents($("shareText"));
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      $("copy").textContent = "選択しました。コピーしてください";
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  });

  selectTab(location.hash.slice(1));
})();
</script>
</body>
</html>
